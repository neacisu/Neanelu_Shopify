# =============================================================================
# Neanelu Shopify Manager - Staging Docker Compose
# =============================================================================
# Purpose:
# - Run ONLY application/runtime services on CT112 (staging)
# - Shared infrastructure is centralized (Traefik/OpenBao/obs on orchestrator,
#   PostgreSQL on CT107, Redis shared on orchestrator).
#
# Usage (on CT112):
#   docker compose -f docker-compose.staging.yml up -d
# =============================================================================

name: neanelu

services:
  openbao-agent-api:
    image: quay.io/openbao/openbao:2.5.0
    container_name: neanelu-openbao-agent-api
    restart: unless-stopped
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-api.hcl
    environment:
      NEANELU_ENV: staging
    extra_hosts:
      - 's3cr3ts.neanelu.ro:10.0.1.10'
    volumes:
      - ./infra/config/openbao/agent-api.hcl:/openbao/config/agent-api.hcl:ro
      - ./infra/config/openbao/templates:/openbao/templates:ro
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/api:/secrets
      - ./secrets/staging_api_role_id:/openbao/config/role_id:ro
      - ./secrets/staging_api_secret_id:/openbao/config/secret_id:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/secrets/neanelu-api.env']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # DEV (dedicated stack on CT112) - enabled via profile "dev"
  # ---------------------------------------------------------------------------
  openbao-agent-dev-api:
    profiles: ['dev']
    image: quay.io/openbao/openbao:2.5.0
    container_name: neanelu-openbao-agent-dev-api
    restart: unless-stopped
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-api.hcl
    environment:
      NEANELU_ENV: dev
    extra_hosts:
      - 's3cr3ts.neanelu.ro:10.0.1.10'
    volumes:
      - ./infra/config/openbao/agent-api.hcl:/openbao/config/agent-api.hcl:ro
      - ./infra/config/openbao/templates:/openbao/templates:ro
      - /run/neanelu-dev/runtime-secrets/api:/secrets
      - ./secrets/dev_api_role_id:/openbao/config/role_id:ro
      - ./secrets/dev_api_secret_id:/openbao/config/secret_id:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/secrets/neanelu-api.env']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  openbao-agent-infra:
    image: quay.io/openbao/openbao:2.5.0
    container_name: neanelu-openbao-agent-infra
    restart: unless-stopped
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    command: agent -config=/openbao/config/agent-infra.hcl
    environment:
      NEANELU_ENV: staging
    extra_hosts:
      - 's3cr3ts.neanelu.ro:10.0.1.10'
    volumes:
      - ./infra/config/openbao/agent-infra.hcl:/openbao/config/agent-infra.hcl:ro
      - ./infra/config/openbao/templates:/openbao/templates:ro
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/infra:/secrets
      - ./secrets/staging_infra_role_id:/openbao/config/role_id:ro
      - ./secrets/staging_infra_secret_id:/openbao/config/secret_id:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/secrets/pgbouncer.ini']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: neanelu-pgbouncer
    restart: unless-stopped
    user: '1000:1000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/infra:/etc/pgbouncer:ro
    ports:
      - '127.0.0.1:6432:6432'
    entrypoint: ['/usr/bin/pgbouncer', '/etc/pgbouncer/pgbouncer.ini']
    depends_on:
      openbao-agent-infra:
        condition: service_healthy

  backend-worker:
    image: ${NEANELU_REGISTRY:-ghcr.io}/${NEANELU_IMAGE_PREFIX:-neacisu/neanelu-shopify}/backend-worker:${NEANELU_VERSION:-latest}
    container_name: neanelu-backend-worker
    restart: unless-stopped
    env_file:
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/api/neanelu-api.env
    environment:
      NODE_ENV: staging
      DOCKER: 'true'
      PORT: '65000'
    volumes:
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/api:/secrets:ro
    ports:
      - '65000:65000'
    depends_on:
      openbao-agent-api:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  backend-worker-dev:
    profiles: ['dev']
    # Keep backend on the shared release tag; dev-specific UI can be patched independently.
    image: ${NEANELU_REGISTRY:-ghcr.io}/${NEANELU_IMAGE_PREFIX:-neacisu/neanelu-shopify}/backend-worker:${NEANELU_VERSION:-latest}
    container_name: neanelu-backend-worker-dev
    restart: unless-stopped
    env_file:
      - /run/neanelu-dev/runtime-secrets/api/neanelu-api.env
    environment:
      DOCKER: 'true'
      PORT: '65000'
    volumes:
      - /run/neanelu-dev/runtime-secrets/api:/secrets:ro
    ports:
      - '65100:65000'
    depends_on:
      openbao-agent-dev-api:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  web-admin:
    image: ${NEANELU_REGISTRY:-ghcr.io}/${NEANELU_IMAGE_PREFIX:-neacisu/neanelu-shopify}/web-admin:${NEANELU_VERSION:-latest}
    container_name: neanelu-web-admin
    restart: unless-stopped
    env_file:
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/api/neanelu-api.env
    environment:
      NODE_ENV: staging
      DOCKER: 'true'
      FRONTEND_PORT: '65001'
    ports:
      - '65001:65001'
    depends_on:
      openbao-agent-api:
        condition: service_healthy

  web-admin-dev:
    profiles: ['dev']
    image: ${NEANELU_REGISTRY:-ghcr.io}/${NEANELU_IMAGE_PREFIX:-neacisu/neanelu-shopify}/web-admin:${NEANELU_VERSION_DEV:-latest}
    container_name: neanelu-web-admin-dev
    restart: unless-stopped
    env_file:
      - /run/neanelu-dev/runtime-secrets/api/neanelu-api.env
    environment:
      DOCKER: 'true'
      FRONTEND_PORT: '65001'
    ports:
      - '65101:65001'
    depends_on:
      openbao-agent-dev-api:
        condition: service_healthy

  bull-board:
    image: node:24-bookworm-slim
    container_name: neanelu-bull-board
    restart: unless-stopped
    command: ['sh', '-lc', "echo 'bull-board placeholder (not implemented yet)' && sleep infinity"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: neanelu-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '65210:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.11.1
    container_name: neanelu-pgbouncer-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'
    volumes:
      - ${NEANELU_RENDERED_SECRETS_DIR:-/run/neanelu/runtime-secrets}/infra/userlist.txt:/secrets/userlist.txt:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        USER=$$(head -1 /secrets/userlist.txt | cut -d'"' -f2)
        PASS=$$(head -1 /secrets/userlist.txt | cut -d'"' -f4)
        CS="host=pgbouncer port=6432 user=$${USER} password=$${PASS} dbname=pgbouncer sslmode=disable connect_timeout=10"
        exec /bin/pgbouncer_exporter \
          --pgBouncer.connectionString="$${CS}" \
          --web.listen-address=":9127"
    ports:
      - '65211:9127'
    depends_on:
      pgbouncer:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: neanelu-node-exporter
    restart: unless-stopped
    network_mode: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
