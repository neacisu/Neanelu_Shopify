name: Sync OpenBao -> GitHub Secrets

on:
  workflow_dispatch:
    inputs:
      openbao_api_secret_path:
        description: 'OpenBao secret path for API tokens (default: secret/neanelu/prod/api)'
        required: false
        default: 'secret/neanelu/prod/api'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  sync-repo-secrets:
    name: Sync repository secrets from OpenBao
    runs-on: [self-hosted, neanelu]
    timeout-minutes: 10
    env:
      OPENBAO_ADDR: '${{ secrets.OPENBAO_ADDR }}'
      OPENBAO_CICD_ROLE_ID: '${{ secrets.OPENBAO_CICD_ROLE_ID }}'
      OPENBAO_CICD_SECRET_ID: '${{ secrets.OPENBAO_CICD_SECRET_ID }}'
      GH_TOKEN: '${{ secrets.GH_SECRETS_SYNC_TOKEN }}'
      OPENBAO_API_SECRET_PATH: '${{ inputs.openbao_api_secret_path }}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required sync secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENBAO_ADDR}" || (echo "Missing OPENBAO_ADDR" >&2; exit 1)
          test -n "${OPENBAO_CICD_ROLE_ID}" || (echo "Missing OPENBAO_CICD_ROLE_ID" >&2; exit 1)
          test -n "${OPENBAO_CICD_SECRET_ID}" || (echo "Missing OPENBAO_CICD_SECRET_ID" >&2; exit 1)
          test -n "${GH_TOKEN}" || (echo "Missing GH_SECRETS_SYNC_TOKEN" >&2; exit 1)

      - name: OpenBao login (AppRole)
        env:
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
          OPENBAO_CICD_ROLE_ID: ${{ secrets.OPENBAO_CICD_ROLE_ID }}
          OPENBAO_CICD_SECRET_ID: ${{ secrets.OPENBAO_CICD_SECRET_ID }}
        run: python3 .github/scripts/openbao_ci_login.py

      - name: Export tokens from OpenBao
        run: python3 .github/scripts/openbao_export_api_tokens.py

      - name: Sync BullMQ/NPM tokens to GitHub repository secrets
        shell: bash
        run: |
          set -euo pipefail
          gh secret set NPM_TASKFORCESH_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${EXPORTED_NPM_TASKFORCESH_TOKEN}"
          gh secret set BULLMQ_PRO_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${EXPORTED_BULLMQ_PRO_TOKEN}"
          echo "Synced NPM_TASKFORCESH_TOKEN and BULLMQ_PRO_TOKEN from OpenBao."
