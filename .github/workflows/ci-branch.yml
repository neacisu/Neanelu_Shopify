# ============================================
# Neanelu Shopify - CD trigger (branch -> staging)
# ============================================
# IMPORTANT:
# - This workflow triggers deployment ONLY after CI succeeded on a push event.
# - It does NOT run on pull_request events (no deploy from PRs).

name: CD - Branch to Staging

on:
  workflow_run:
    workflows: ['CI - Pull Request']
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  trigger-deploy-staging:
    name: Trigger deploy.yml (staging)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy workflow (staging)
        uses: actions/github-script@v7
        with:
          script: |
            const headBranch = context.payload.workflow_run.head_branch;
            const sha = context.payload.workflow_run.head_sha;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: headBranch,
              inputs: { environment: 'staging', version: sha },
            });
            core.info(`Triggered deploy.yml env=staging ref=${headBranch} sha=${sha}`);
