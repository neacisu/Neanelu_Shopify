# ============================================
# Neanelu Shopify - CD Deploy Workflow
# ============================================
# Deploys staging/prod to CT112/CT111 using:
# - Shared services: Traefik/OpenBao/Redis/Observability on orchestrator
# - PostgreSQL on CT107 (direct for migrations, PgBouncer for runtime)
#
# Triggered by:
# - CI workflow_call from ci-pr.yml after all checks pass
# - Manual workflow_dispatch for ad-hoc deploys or rollbacks
#
# Required GitHub Secrets (GHCR uses GITHUB_TOKEN, no PAT needed):
# - OPENBAO_ADDR / OPENBAO_CICD_ROLE_ID / OPENBAO_CICD_SECRET_ID: OpenBao AppRole
# - SSH_KEY_DEPLOY: private key for deploy@CT111/CT112 AND neanelu-ci@CT107
# - NPM_TASKFORCESH_TOKEN / BULLMQ_PRO_TOKEN: private registry tokens
#
name: CD - Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      version:
        description: 'Docker image tag (e.g. sha, v0.0.X). Required.'
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.28.0'
  OPENBAO_ADDR: '${{ secrets.OPENBAO_ADDR }}'
  TARGET_ENV: '${{ inputs.environment }}'
  DEPLOY_VERSION: '${{ inputs.version }}'

jobs:
  # ── Build images & push to GHCR ─────────────────────────
  build-push:
    name: Build & Push images
    runs-on: [self-hosted, neanelu]
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Purge stale git state
        run: rm -rf .git

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute image tag
        id: tag
        run: echo "tag=${DEPLOY_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend-worker/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/neacisu/neanelu-shopify/backend-worker:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend-worker
          cache-to: type=gha,scope=backend-worker,mode=max
          secrets: |
            npm_token=${{ secrets.NPM_TASKFORCESH_TOKEN }}

      - name: Build & push web-admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-admin/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/neacisu/neanelu-shopify/web-admin:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web-admin
          cache-to: type=gha,scope=web-admin,mode=max
          secrets: |
            npm_token=${{ secrets.NPM_TASKFORCESH_TOKEN }}

  # ── DB backup + migrations (runs IN PARALLEL with build-push) ──
  migrate:
    name: DB backup & migrations
    runs-on: [self-hosted, neanelu]
    timeout-minutes: 20
    env:
      NPM_TASKFORCESH_TOKEN: '${{ secrets.NPM_TASKFORCESH_TOKEN }}'
      BULLMQ_PRO_TOKEN: '${{ secrets.BULLMQ_PRO_TOKEN }}'
    steps:
      - name: Purge stale git state
        run: rm -rf .git

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install deps
        run: |
          pnpm install --frozen-lockfile || {
            echo "pnpm install failed (likely corrupted store on self-hosted runner), retrying with clean store..."
            pnpm store prune || true
            pnpm install --frozen-lockfile --force
          }

      - name: Fetch OpenBao dynamic DB creds
        shell: bash
        env:
          OPENBAO_CICD_ROLE_ID: '${{ secrets.OPENBAO_CICD_ROLE_ID }}'
          OPENBAO_CICD_SECRET_ID: '${{ secrets.OPENBAO_CICD_SECRET_ID }}'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          bao = os.environ['OPENBAO_ADDR'].rstrip('/')
          rid = os.environ['OPENBAO_CICD_ROLE_ID'].strip()
          sid = os.environ['OPENBAO_CICD_SECRET_ID'].strip()
          target = os.environ['TARGET_ENV']
          role = 'neanelu-staging-dynamic' if target == 'staging' else 'neanelu-prod-dynamic'
          db = 'neanelu_shopify_staging' if target == 'staging' else 'neanelu_shopify'
          req = urllib.request.Request(
              bao + '/v1/auth/approle/login', method='POST',
              data=json.dumps({'role_id': rid, 'secret_id': sid}).encode(),
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=20) as r:
              tok = json.loads(r.read())['auth']['client_token']
          req = urllib.request.Request(
              f"{bao}/v1/neanelu-db/creds/{role}",
              headers={'X-Vault-Token': tok})
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.loads(r.read())['data']
          u, p = data['username'], data['password']
          url = f"postgresql://{u}:{p}@10.0.1.107:5432/{db}"
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'MIGRATION_DATABASE_URL={url}\n')
              f.write(f'DATABASE_URL={url}\n')
              f.write(f'DB_USER={u}\n')
              f.write(f'DB_PASS={p}\n')
              f.write(f'DB_NAME={db}\n')
          PY

      - name: Setup SSH key (CT107)
        run: |
          install -d -m 0700 ~/.ssh
          echo "${{ secrets.SSH_KEY_DEPLOY }}" > ~/.ssh/ct107_key
          chmod 0600 ~/.ssh/ct107_key

      - name: Pre-deploy backup (pg_dump on CT107 via SSH)
        env:
          DEPLOY_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p predeploy-backup
          dump="predeploy-backup/${TARGET_ENV}_${DEPLOY_SHA}_${ts}.dump"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            -i ~/.ssh/ct107_key neanelu-ci@10.0.1.107 \
            "PGPASSWORD='${DB_PASS}' pg_dump -h 127.0.0.1 -p 5432 \
              -U '${DB_USER}' -d '${DB_NAME}' \
              -Fc --no-owner --no-acl \
              --exclude-schema=drizzle \
              --exclude-table='__drizzle_migrations*' \
              --enable-row-security" \
            > "${dump}"
          sha256sum "${dump}" > "${dump}.sha256"
          ls -lh "${dump}"

      - uses: actions/upload-artifact@v4
        with:
          name: predeploy-backup-${{ env.TARGET_ENV }}-${{ github.sha }}
          path: predeploy-backup/*
          retention-days: 14

      - name: Run migrations
        run: pnpm db:migrate

  # ── Deploy to target LXC ────────────────────────────────
  deploy:
    name: Deploy to ${{ inputs.environment == 'staging' && 'CT112' || 'CT111' }}
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, neanelu]
    timeout-minutes: 15
    needs: [build-push, migrate]
    steps:
      - name: Purge stale git state
        run: rm -rf .git

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Deploy
        shell: bash
        env:
          TAG: '${{ needs.build-push.outputs.image_tag }}'
        run: |
          set -euo pipefail

          if [[ "${TARGET_ENV}" == "staging" ]]; then
            HOST="10.0.1.112"; COMPOSE="docker-compose.staging.yml"
          else
            HOST="10.0.1.111"; COMPOSE="docker-compose.prod.yml"
          fi

          install -d -m 0700 ~/.ssh
          echo "${{ secrets.SSH_KEY_DEPLOY }}" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"
          SCP="scp -q -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"

          rollback() {
            echo "deploy_failed -> rollback" >&2
            $SSH "deploy@${HOST}" "\
              set -euo pipefail; \
              for svc in backend-worker web-admin; do \
                latest=\$(ls -1t /opt/neanelu/rollback/\${svc}-*.tar.gz 2>/dev/null | head -1); \
                if [[ -n \"\${latest}\" && -f \"\${latest}\" ]]; then \
                  echo \"rollback_load \${svc} \${latest}\"; \
                  gunzip -c \"\${latest}\" | docker load; \
                else \
                  echo \"WARN: no rollback image for \${svc}\" >&2; \
                fi; \
              done; \
              if [[ -f /opt/neanelu/.env.prev ]]; then cp -f /opt/neanelu/.env.prev /opt/neanelu/.env; fi; \
              cd /opt/neanelu && docker compose -f ${COMPOSE} up -d || true"
          }
          trap rollback ERR

          $SSH "deploy@${HOST}" "mkdir -p /opt/neanelu/infra/scripts"
          $SCP \
            "./${COMPOSE}" \
            "./infra/scripts/verify-deployment.sh" \
            "./infra/scripts/rollback-save.sh" \
            "./infra/scripts/post-deploy-cleanup.sh" \
            "deploy@${HOST}:/opt/neanelu/"
          $SSH "deploy@${HOST}" "\
            mv -f /opt/neanelu/verify-deployment.sh /opt/neanelu/rollback-save.sh /opt/neanelu/post-deploy-cleanup.sh /opt/neanelu/infra/scripts/ 2>/dev/null || true; \
            chmod 0755 /opt/neanelu/infra/scripts/verify-deployment.sh /opt/neanelu/infra/scripts/rollback-save.sh /opt/neanelu/infra/scripts/post-deploy-cleanup.sh"

          $SSH "deploy@${HOST}" "\
            cd /opt/neanelu && bash /opt/neanelu/infra/scripts/rollback-save.sh ${COMPOSE}; \
            if [[ -f /opt/neanelu/.env ]]; then cp -f /opt/neanelu/.env /opt/neanelu/.env.prev; fi; \
            printf 'NEANELU_VERSION=%s\nNEANELU_REGISTRY=ghcr.io\nNEANELU_IMAGE_PREFIX=neacisu/neanelu-shopify\n' '${TAG}' > /opt/neanelu/.env"

          $SSH "deploy@${HOST}" "\
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
            cd /opt/neanelu && \
            docker compose -f ${COMPOSE} pull backend-worker web-admin bull-board && \
            docker compose -f ${COMPOSE} up -d"

          $SSH "deploy@${HOST}" "bash /opt/neanelu/infra/scripts/verify-deployment.sh"

      - name: Post-deploy HTTP verification
        env:
          BASE_URL: ${{ inputs.environment == 'staging' && 'https://staging.manager.neanelu.ro' || 'https://manager.neanelu.ro' }}
        run: |
          set -euo pipefail
          out="postdeploy-http-${TARGET_ENV}.txt"
          {
            echo "base_url=${BASE_URL}"
            echo "ts=$(date -u +%Y%m%dT%H%M%SZ)"
            for ep in /api/health/live /api/health/ready /health/live /health/ready; do
              echo "--- ${ep}"
              curl -sk --max-time 8 -w "\nhttp_code=%{http_code}\n" "${BASE_URL}${ep}" || true
            done
            echo "--- OAuth start (non-destructive)"
            curl -skI --max-time 8 -o /dev/null -w "http_code=%{http_code} redirect=%{redirect_url}\n" \
              "${BASE_URL}/auth?shop=unit-test.myshopify.com" || true
          } | tee "${out}"

      - name: Create Git tag (production)
        if: inputs.environment == 'production'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${DEPLOY_VERSION}" -m "Release ${DEPLOY_VERSION} (auto-generated by CD)"
          git push origin "${DEPLOY_VERSION}"

      - name: Post-deploy cleanup
        run: |
          set -euo pipefail
          if [[ "${TARGET_ENV}" == "staging" ]]; then HOST="10.0.1.112"; else HOST="10.0.1.111"; fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key "deploy@${HOST}" \
            "bash /opt/neanelu/infra/scripts/post-deploy-cleanup.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: postdeploy-http-${{ env.TARGET_ENV }}-${{ github.sha }}
          path: postdeploy-http-*.txt
          retention-days: 7
