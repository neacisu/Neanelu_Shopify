# =============================================================================
# Hot-reload dev override for hz.164
# =============================================================================
# Usage:
#   pnpm dev:local:build   (first time or after dependency changes)
#   pnpm dev:local          (start dev stack with hot-reload)
#   pnpm dev:local:logs     (follow logs)
#
# Overrides backend-worker-dev and web-admin-dev from docker-compose.staging.yml
# with local builds and source volume mounts for hot-reload.
# =============================================================================

services:
  backend-worker-dev:
    build:
      context: .
      dockerfile: apps/backend-worker/Dockerfile
      secrets:
        - npm_token
    image: neanelu-backend-worker:local-dev
    volumes:
      - ./apps/backend-worker/src:/app/apps/backend-worker/src
      - ./packages/database/src:/app/packages/database/src
      - /run/neanelu-dev/runtime-secrets/api:/secrets:ro
    command:
      [
        'sh',
        '-lc',
        'export DATABASE_URL="$$MIGRATION_DATABASE_URL"; pnpm --filter @app/backend-worker dev:watch',
      ]
    networks:
      default:
        aliases:
          - backend-worker

  web-admin-dev:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile.dev
      secrets:
        - npm_token
    image: neanelu-web-admin:local-dev
    volumes:
      - ./apps/web-admin/app:/app/apps/web-admin/app
      - ./apps/web-admin/components:/app/apps/web-admin/components
      - ./apps/web-admin/public:/app/apps/web-admin/public
      - ./apps/web-admin/vite.config.ts:/app/apps/web-admin/vite.config.ts
      - ./apps/web-admin/vite.proxy-ws.ts:/app/apps/web-admin/vite.proxy-ws.ts
      - ./apps/web-admin/vite.shopify-hmr.ts:/app/apps/web-admin/vite.shopify-hmr.ts

secrets:
  npm_token:
    environment: NPM_TASKFORCESH_TOKEN
