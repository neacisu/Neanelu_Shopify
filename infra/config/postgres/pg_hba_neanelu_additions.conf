# Neanelu Shopify - pg_hba.conf additions (ADITIVE)
#
# Scop:
# - Permite conexiuni strict allowlisted pentru Neanelu (prod/staging/dev) pe CT107
# - SCRAM only (fara trust)
# - Foloseste "+neanelu_app" (rol de grup) ca sa permita login pt useri dinamici
#   creati de OpenBao DB engine (membri ai rolului neanelu_app).
#
# NOTA:
# - Acest fisier NU se include automat in pg_hba.conf; este "source of truth" pentru patch-uri controlate.
# - Aplica pe CT107 in /etc/postgresql/18/main/pg_hba.conf, apoi:
#     SELECT pg_reload_conf();

# CT111 (prod)
host  neanelu_shopify          +neanelu_app  10.0.1.111/32  scram-sha-256
# CT112 (staging)
host  neanelu_shopify_staging  +neanelu_app  10.0.1.112/32  scram-sha-256

# Pragmatic: allow dev DB access from CT111/CT112 for smoke tests/debug (as-built on CT107).
host  neanelu_shopify_dev      +neanelu_app  10.0.1.111/32  scram-sha-256
host  neanelu_shopify_dev      +neanelu_app  10.0.1.112/32  scram-sha-256

# Dev subnet (doar DB dev)
host  neanelu_shopify_dev      +neanelu_app  10.0.1.0/24    scram-sha-256

# OpenBao (orchestrator) -> role admin pentru DB engine
host  all                      neanelu_vault 10.0.0.2/32    scram-sha-256

# CI/CD runner (CT108) -> migrations + smoke tests (direct la Postgres; bypass PgBouncer)
host  neanelu_shopify          +neanelu_app  10.0.1.108/32  scram-sha-256
host  neanelu_shopify_staging  +neanelu_app  10.0.1.108/32  scram-sha-256
host  neanelu_shopify_dev      +neanelu_app  10.0.1.108/32  scram-sha-256

# CI clones: DB-urile temporare au nume dinamice (ex: neanelu_shopify_*_ci_*).
# pg_hba.conf nu suporta pattern-uri pe numele DB, deci permitem CT108 -> all DBs pentru
# +neanelu_app (role membership dinamic OpenBao). CT108 este allowlisted strict in retea.
host  all                      +neanelu_app  10.0.1.108/32  scram-sha-256

