services:
  llm-guard:
    image: laiyer/llm-guard-api:latest
    container_name: llm-guard
    restart: unless-stopped
    entrypoint:
      - uvicorn
    command:
      - app.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - '8000'
    ports:
      - '8000:8000'
    env_file:
      - /run/llm-secrets/guardrails.env
    volumes:
      - ./config/scanners.yml:/home/user/app/config/scanners.yml:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python3 -c \"import urllib.request; urllib.request.urlopen(\\\"http://127.0.0.1:8000/healthz\\\", timeout=3)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
