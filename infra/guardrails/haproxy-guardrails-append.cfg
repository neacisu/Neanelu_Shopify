frontend ft_guardrails
    bind 10.0.1.10:49004
    mode http
    acl guardrails_sensitive_path path_beg /analyze /scan /healthz
    http-request deny deny_status 401 if guardrails_sensitive_path !{ req.hdr(Authorization) -m found }
    default_backend bk_guardrails

backend bk_guardrails
    mode http
    option httpchk GET /healthz
    server orchestrator-guard 10.0.0.2:8000 check inter 10s fall 3 rise 2
